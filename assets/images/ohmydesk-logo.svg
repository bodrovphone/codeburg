<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 48" role="img" aria-label="OhMyDesk landing logo">
  <defs>
    <linearGradient id="landing-bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffca66"/>
      <stop offset="100%" stop-color="#c8922a"/>
    </linearGradient>
  </defs>

  <!-- Icon in rounded square -->
  <g transform="translate(2, 4)">
    <rect width="40" height="40" rx="10" fill="url(#landing-bg)"/>

    <!-- Desk surface -->
    <rect x="6" y="20" width="28" height="3" rx="1.5" fill="#15120e"/>

    <!-- Desk legs -->
    <rect x="9" y="23" width="2" height="10" rx="0.8" fill="rgba(21,18,14,0.85)"/>
    <rect x="29" y="23" width="2" height="10" rx="0.8" fill="rgba(21,18,14,0.85)"/>

    <!-- Monitor -->
    <rect x="11" y="7" width="18" height="12" rx="2" fill="rgba(21,18,14,0.9)"/>

    <!-- Monitor stand -->
    <rect x="18" y="19" width="4" height="2" rx="0.5" fill="rgba(21,18,14,0.85)"/>

    <!-- Calendar dots -->
    <circle cx="16" cy="11.5" r="1.2" fill="#ffca66"/>
    <circle cx="20" cy="11.5" r="1.2" fill="#e08a5a"/>
    <circle cx="24" cy="11.5" r="1.2" fill="#ffca66"/>
    <circle cx="16" cy="15.5" r="1.2" fill="#e08a5a"/>
    <circle cx="20" cy="15.5" r="1.2" fill="#74b98a"/>
    <circle cx="24" cy="15.5" r="1.2" fill="#ffca66"/>
  </g>

  <!-- Wordmark -->
  <text x="50" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="22" letter-spacing="-0.3">
    <tspan font-weight="600" fill="#fff9ef">OhMy</tspan><tspan font-weight="700" fill="#ffca66">Desk</tspan><tspan fill="#e08a5a">.</tspan>
  </text>
</svg>
